# Shared Streamlit theme and server settings for the dashboards.
# Minimal design: white page, near-black text, one blue accent, hairline borders, small radius. The finer rules
# (type scale, spacing, flat alerts and metrics) are in dashboards/assets/minimal.css.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f7f5"
textColor = "#111111"
linkColor = "#2a78d6"
borderColor = "#e8e7e2"
font = "sans serif"
baseRadius = "6px"
showSidebarBorder = true
headingFontSizes = ["2rem", "1.2rem", "1.05rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

[client]
toolbarMode = "minimal"        # no Deploy button or menu

[server]
headless = true
enableStaticServing = true     # serves dashboards/static (the 3D simulator page) at /app/static/...

[browser]
gatherUsageStats = false
