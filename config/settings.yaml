# Central configuration. Every module reads this through config/__init__.py (load_settings).
# Changing the study region or years here is the only edit needed to re-run the pipeline.

project:
  name: climateresilience-india
  random_seed: 42

# Study region used for development (rice-heavy southern states). Names must match the
# state names in the boundary file after normalisation via config/district_name_map.csv.
states:
  - Tamil Nadu
  - Andhra Pradesh
  - Telangana
  - Karnataka

crops:
  - rice
  - wheat
  - cotton
  - sugarcane

# Growing seasons (inclusive month ranges). Rabi spans the year boundary.
seasons:
  kharif: {start_month: 6, end_month: 10}
  rabi: {start_month: 11, end_month: 3}

# Crop-year window used for yield modelling. ICRISAT's district database ends at crop year 2017
# (checked 2026-10-16), so real yields cannot extend further; see docs/DECISIONS.md D-006.
# Crop year Y = the season(s) starting in calendar year Y (rabi runs Nov Y - Mar Y+1).
# history_start: earlier yields are kept in crops_annual so lag-1 / 3-year-mean features exist
# for the first modelling year (weather exists from 1991, satellite only from 2000).
years:
  history_start: 1991
  start: 2000
  end: 2017

# Daily weather window: 1991-2020 climatological normals (Phase 5) need data from 1991, and the
# extreme-weather test years run to 2024.
weather_years:
  start: 1991
  end: 2024

# MODIS starts in Feb 2000, so satellite features start in 2000.
satellite_years:
  start: 2000
  end: 2024

# ICRISAT reports annual crop totals; each crop is attributed to the season in which it is
# predominantly grown (documented limitation, docs/DECISIONS.md D-007).
crop_season:
  rice: kharif
  wheat: rabi
  cotton: kharif
  sugarcane: kharif

# Time-based splits (CLAUDE.md: never random-split time series).
splits:
  yield:          # shifted from the plan's 2018/2019-21/2022-24 because real yields end in 2017
    train_end: 2011
    valid: [2012, 2014]
    test: [2015, 2017]
  extreme_weather:
    train_end: 2014
    valid: [2015, 2019]
    test: [2020, 2024]
    # Heatwave onsets are so rare (2020-2024 has only 3) that the fixed split above cannot support
    # conclusions. These extra rolling-origin folds (always train on earlier years, validate on the
    # years just before the test block) pool more out-of-sample onsets; the fixed split is the last fold.
    rolling_origin:
      - {train: [1991, 2001], valid: [2002, 2004], test: [2005, 2009]}
      - {train: [1991, 2006], valid: [2007, 2009], test: [2010, 2014]}
      - {train: [1991, 2011], valid: [2012, 2014], test: [2015, 2019]}

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models: models
  reports: reports
  figures: reports/figures
  docs: docs
  simulator: simulator

# Phase 1 data-source switches. Real data is always preferred; a synthetic generator only
# fills a source that is unreachable, and its rows are flagged is_synthetic=True.
etl:
  grid_resolution_deg: 0.25
  boundaries:
    iso3: IND
    level: ADM2
    # Polygons that geoBoundaries attributes to a study state but that belong elsewhere
    # (Yanam is a Puducherry enclave inside Andhra Pradesh; ICRISAT has no data for it).
    exclude_districts: [Yanam]
  # Real data is preferred. IMD gridded rain/Tmax/Tmin first, NASA POWER as the real fallback,
  # synthetic generators only if both fail (rows are then flagged is_synthetic=True).
  allow_synthetic_fallback: true
  power_parameters: [RH2M, WS2M, ALLSKY_SFC_SW_DWN, T2M_MAX, T2M_MIN, PRECTOTCORR]
  # Soil moisture: SMAP (GEE NASA_USDA/HSL/SMAP10KM_soil_moisture) only starts in April 2015, so
  # ERA5-Land layer-1 volumetric soil water (1950+) is used to cover the whole study window.
  soil_moisture_source: era5_land
  min_crop_area_ha: 100
  # Reliability filter for crop rows (etl/crop_yield.py: filter_unreliable). A row is dropped when
  # ICRISAT's reported yield differs from production/area by more than this share, or when the
  # recomputed yield is outside the crop's plausible district-average range (t/ha). Dropped rows are
  # listed in docs/DATA_QUALITY.md. Sugarcane has no bound: its ICRISAT unit is unclear (D-007).
  max_yield_mismatch: 0.5
  max_plausible_yield_t_ha: {rice: 7.0, wheat: 4.5, cotton: 1.2}
  min_plausible_yield_t_ha: {rice: 0.2, wheat: 0.1, cotton: 0.02}

# Phase 5 risk levels. Thresholds apply to each hazard's *calibrated probability* and differ per hazard because
# the base rates differ by an order of magnitude: a heatwave onset within 14 days in the March-June season
# has a base rate of well under 1 percent, while next-month SPI-3 drought has a base rate of 8-20 percent.
# The overall level is the higher of the two hazard levels. See reports/extreme_weather_report.md.
risk_levels:
  heatwave: {moderate: 0.05, high: 0.15, severe: 0.35}
  drought: {moderate: 0.30, high: 0.50, severe: 0.70}

# Phase 9 advisory rules (advisory/generate.py). Thresholds are deterministic and documented in advisory/README.md.
advisory:
  alert_min_level: moderate     # hazards below this level produce no alert message
  irrigation_min_mm: 5          # planned weekly irrigation below this is not worth a message
  sowing_lead_days: 21          # announce the sowing window this many days before the season starts
  sms_max_chars: 320
  delivery:                     # outbound limits applied by advisory/twilio_client.py (sending is a dry run unless DRY_RUN=false)
    max_per_minute: 30          # all recipients together
    per_recipient_per_day: 3    # protects one phone from repeated sends by a faulty loop
  bot:                          # advisory/conversation.py (WhatsApp assistant)
    session_ttl_minutes: 30     # how long a sender's last district/crop is remembered (memory only)
    accept_score: 92            # fuzzy district match this good (0-100) and clearly ahead of the runner-up is accepted
    confirm_score: 70           # between this and accept_score the bot asks "Did you mean ...?"
    messages_per_minute: 10     # per sender

# Early-warning relevance rule (analytics/predictive/extreme_weather.py: risk_forecast): a drought probability only sets
# the risk level if the target month normally receives at least this much rain (district mean over the reference years).
# SPI of an almost-dry month is noisy and agronomically meaningless (e.g. January in Telangana).
early_warning:
  drought_min_month_rain_mm: 40
